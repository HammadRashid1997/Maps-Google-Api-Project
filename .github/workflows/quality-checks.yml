name: Repository Quality Checks

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  basic-checks:
    name: Branch, PR and Commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch name length
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          LENGTH=${#BRANCH_NAME}

          echo "Branch: $BRANCH_NAME"
          echo "Length: $LENGTH characters"

          if [ "$LENGTH" -ge 10 ]; then
            echo "::error::Branch name must be fewer than 10 characters."
            exit 1
          fi

          echo "Branch name check passed."

      - name: Check pull request title length
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          LENGTH=${#PR_TITLE}

          echo "PR title: $PR_TITLE"
          echo "Length: $LENGTH characters"

          if [ "$LENGTH" -ge 100 ]; then
            echo "::error::PR title must be fewer than 100 characters."
            exit 1
          fi

          echo "PR title check passed."

      - name: Check commit message lengths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -t COMMITS < <(
              git log --format=%s "origin/$BASE_BRANCH..HEAD"
            )
          else
            mapfile -t COMMITS < <(
              git log -1 --format=%s HEAD
            )
          fi

          if [ "${#COMMITS[@]}" -eq 0 ]; then
            echo "::error::No commit messages found to validate."
            exit 1
          fi

          for MESSAGE in "${COMMITS[@]}"; do
            LENGTH=${#MESSAGE}

            echo "Commit: $MESSAGE"
            echo "Length: $LENGTH characters"

            if [ "$LENGTH" -ge 100 ]; then
              echo "::error::Commit subject must be fewer than 100 characters."
              exit 1
            fi
          done

          echo "Commit message checks passed."
